blueprint:
  name: Window Heating Control (WHC) - Intelligent Restore
  description: |
    ## 🌡️ Window Heating Control (WHC)
    Gestion intelligente du chauffage avec détection automatique du mode.

    ### 🛠️ Fonctionnalités :
    - **Restauration Intelligente :** Si le thermostat était en 'auto', il reprend son planning. S'il était en 'manuel', il reprend sa consigne exacte.
    - **Mémoire d'État :** Utilise une scène snapshot pour archiver les réglages avant coupure.
    - **Sécurité Redémarrage :** Relance le chauffage en mode auto si la scène est perdue après un crash/reboot.
    - **Notifications :** Alertes multilingues avec horodatage (HH:MM) et température extérieure.

    ---
    📑 [Documentation & Support](https://github.com/rirethy/WindowHeatingControl)
  domain: automation
  version: '2.0.0'
  source_url: https://github.com/rirethy/WindowHeatingControl/blob/main/window_heating_control.yaml
  input:
    window_sensor:
      name: Capteur de fenêtre
      selector:
        entity:
          domain: binary_sensor
    climate_entities:
      name: Thermostats
      selector:
        entity:
          domain: climate
          multiple: true
    room_name:
      name: Nom de la pièce
    window_opened_flag:
      name: Boolean d'état (Flag)
      selector:
        entity:
          domain: input_boolean
    window_open_duration:
      name: Délai avant coupure chauffage suite à ouverture fenêtre (Secondes)
      default: 45
      selector:
        number:
          min: 5
          max: 600
          unit_of_measurement: seconds
    window_forgotten_duration:
      name: Délai avant alerte oubli fenêtre restée ouverte (Minutes)
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: minutes
    window_close_duration:
      name: Délai avant remise en route chauffage suite à fermeture fenêtre (Minutes)
      default: 15
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: minutes
    temperature_sensor:
      name: Capteur de température extérieure
      selector:
        entity:
          domain: sensor
    notify_devices:
      name: Services de notification (optionnel)
      default: []
      selector:
        entity:
          domain: notify
          multiple: true
    dashboard_path:
      name: Chemin au clic (Notification)
      default: "/lovelace"
    language:
      name: Langue
      default: fr
      selector:
        language:
          languages: [en, fr]

variables:
  room_name: !input room_name
  climate_entities: !input climate_entities
  notify_devices: !input notify_devices
  window_opened_flag: !input window_opened_flag
  temperature_sensor: !input temperature_sensor
  language: !input language
  dashboard_path: !input dashboard_path
  current_temp: "{{ states(temperature_sensor) if states(temperature_sensor) not in ['unknown', 'unavailable'] else '?' }}"
  unit: "{{ state_attr(temperature_sensor, 'unit_of_measurement') | default('°C') }}"
  scene_id: "heating_before_{{ room_name | slugify }}"
  txt:
    fr:
      title: "Gestion du chauffage"
      stop: "Chauffage arrêté dans"
      resume: "Chauffage rallumé dans"
      outside: "dehors"
      forgotten: "⚠️ Fenêtre oubliée ouverte :"
    en:
      title: "Heating Management"
      stop: "Heating stopped in"
      resume: "Heating resumed in"
      outside: "outside"
      forgotten: "⚠️ Window left open in:"

trigger:
  - platform: state
    entity_id: !input window_sensor
    to: "on"
    for:
      seconds: !input window_open_duration
    id: "open"
  - platform: state
    entity_id: !input window_sensor
    to: "off"
    for:
      minutes: !input window_close_duration
    id: "closed"
  - platform: state
    entity_id: !input window_sensor
    to: "on"
    for:
      minutes: !input window_forgotten_duration
    id: "forgotten"

action:
  - choose:
      # --- OUVERTURE ---
      - conditions:
          - condition: trigger
            id: "open"
          - condition: template
            value_template: "{{ expand(climate_entities) | selectattr('state', 'ne', 'off') | list | length > 0 }}"
        sequence:
          - action: scene.create
            data:
              scene_id: "{{ scene_id }}"
              snapshot_entities: "{{ climate_entities }}"
          - action: input_boolean.turn_on
            target:
              entity_id: !input window_opened_flag
          - action: climate.set_hvac_mode
            target:
              entity_id: "{{ climate_entities }}"
            data:
              hvac_mode: "off"
          - if:
              - condition: template
                value_template: "{{ notify_devices | length > 0 }}"
            then:
              - repeat:
                  for_each: "{{ notify_devices }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ txt[language].title }}"
                        message: "{{ txt[language].stop }} {{ room_name }}, {{ current_temp }}{{ unit }} {{ txt[language].outside }} ({{ now().strftime('%H:%M') }})"
                        data:
                          clickAction: "{{ dashboard_path }}"
                          url: "{{ dashboard_path }}"

      # --- FERMETURE ---
      - conditions:
          - condition: trigger
            id: "closed"
          - condition: state
            entity_id: !input window_opened_flag
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: !input window_opened_flag

          - continue_on_error: true
            action: scene.turn_on
            target:
              entity_id: "scene.{{ scene_id }}"

          - delay: 00:00:30

          - if:
              - condition: template
                value_template: "{{ expand(climate_entities) | selectattr('state', 'eq', 'auto') | list | length > 0 }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ climate_entities }}"
                data:
                  hvac_mode: "auto"

          - if:
              - condition: template
                value_template: "{{ expand(climate_entities) | selectattr('state', 'eq', 'off') | list | length > 0 }}"
            then:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ climate_entities }}"
                data:
                  hvac_mode: "auto"

          - if:
              - condition: template
                value_template: "{{ notify_devices | length > 0 }}"
            then:
              - repeat:
                  for_each: "{{ notify_devices }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "{{ txt[language].title }}"
                        message: "{{ txt[language].resume }} {{ room_name }}, {{ current_temp }}{{ unit }} {{ txt[language].outside }} ({{ now().strftime('%H:%M') }})"
                        data:
                          clickAction: "{{ dashboard_path }}"
                          url: "{{ dashboard_path }}"

      # --- OUBLI ---
      - conditions:
          - condition: trigger
            id: "forgotten"
        sequence:
          - if:
              - condition: template
                value_template: "{{ notify_devices | length > 0 }}"
            then:
              - repeat:
                  for_each: "{{ notify_devices }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: "OUBLI FENÊTRE"
                        message: "{{ txt[language].forgotten }} {{ room_name }} ({{ now().strftime('%H:%M') }})"
                        data:
                          priority: high
                          clickAction: "{{ dashboard_path }}"
                          url: "{{ dashboard_path }}"

mode: restart
